  // ------------------------------------------------------------ account sync (db + user capabilities)
  const SYNC = { ref: null, busy: false, again: false, timer: null };
  function setSync(state, text) { const el = $('#sync'); el.className = 'sync' + (state ? ' ' + state : ''); el.textContent = text; }
  const pick = () => ({ done: ST.done, bm: ST.bm, notes: ST.notes, quiz: ST.quiz, last: ST.last, known: ST.known });
  function canon(o) {
    const sortObj = (x) => Object.keys(x || {}).sort().map((k) => [k, x[k]]);
    return JSON.stringify([[...(o.done || [])].sort(), [...(o.bm || [])].sort(), [...(o.known || [])].sort(), sortObj(o.notes), sortObj(o.quiz), o.last || '']);
  }
  function applyState(s) {
    const arr = (a) => (Array.isArray(a) ? a.filter((x) => typeof x === 'string') : []);
    const obj = (o) => (o && typeof o === 'object' && !Array.isArray(o) ? JSON.parse(JSON.stringify(o)) : {});
    ST = { done: arr(s.done), bm: arr(s.bm), notes: obj(s.notes), quiz: obj(s.quiz), last: typeof s.last === 'string' ? s.last : '', known: arr(s.known) };
    saveLocal();
    buildTree();
    if (curLesson) { markActive(curLesson); renderLessonButtons(curLesson); }
    if (location.hash === '#notes') renderNotes();
  }
  function pushRemote() { if (!SYNC.ref) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushRemote, 800); }
  async function flushRemote() {
    if (!SYNC.ref) return;
    if (SYNC.busy) { SYNC.again = true; return; }
    SYNC.busy = true;
    try {
      await SYNC.ref.set(JSON.parse(JSON.stringify(pick())));
      setSync('on', 'Đã lưu vào tài khoản');
    } catch (e) {
      if (e && ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { SYNC.ref = null; setSync('warn', 'Chỉ lưu trên máy này'); }
      else if (e && e.code === 'quota_exceeded') setSync('warn', 'Bộ nhớ tài khoản đầy, đang lưu trên máy này');
      else setSync('warn', 'Chưa lưu được lên tài khoản');
    } finally {
      SYNC.busy = false;
      if (SYNC.again) { SYNC.again = false; flushRemote(); }
    }
  }
  async function initSync() {
    const [db, user] = await Promise.all([capability('db'), capability('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    let ref;
    try { ref = db.doc('data/users/' + uid + '/progress'); } catch (e) { return; }
    setSync('', 'Đang kết nối tài khoản…');
    let first = true;
    const timer = setTimeout(() => { if (first) setSync('warn', 'Chưa kết nối được, đang lưu trên máy này'); }, 10000);
    ref.onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites) return;
      if (first) {
        if (snap.metadata.fromCache) return;   // wait for the store's own answer before merging
        first = false; clearTimeout(timer); SYNC.ref = ref;
        const remote = snap.exists ? snap.data() : null;
        if (!remote) { flushRemote(); return; }
        // First contact on this device: keep everything from both sides.
        const uni = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...b])];
        const merged = { done: uni(remote.done, ST.done), bm: uni(remote.bm, ST.bm), known: uni(remote.known, ST.known),
          notes: Object.assign({}, ST.notes, remote.notes || {}), quiz: Object.assign({}, ST.quiz, remote.quiz || {}), last: remote.last || ST.last };
        applyState(merged);
        if (canon(merged) !== canon(remote)) flushRemote(); else setSync('on', 'Đã đồng bộ tài khoản');
        return;
      }
      // Later snapshots: another device saved; adopt it unless it equals what we have.
      if (snap.exists && canon(snap.data()) !== canon(pick())) { applyState(snap.data()); setSync('on', 'Đã đồng bộ tài khoản'); }
    }, () => { clearTimeout(timer); SYNC.ref = null; setSync('warn', 'Chỉ lưu trên máy này'); });
  }

  // ------------------------------------------------------------ router
  function route() {
    const h = location.hash.slice(1) || 'home';
    let nav = h.split('-')[0];
    curLesson = null;
    if (h.startsWith('l-')) { const id = h.slice(2).replace(/-/g, '.'); renderLesson(id); markActive(id); nav = ''; }
    else if (h.startsWith('code')) { const p = h.split('-'); renderCode(+p[1] || 0, +p[2] || 0); markActive(null); }
    else if (h === 'map') { renderMap(); markActive(null); }
    else if (h === 'flash') { renderFlash(); markActive(null); }
    else if (h === 'notes') { renderNotes(); markActive(null); }
    else { renderHome(); markActive(null); nav = 'home'; }
    $$('.top nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === nav));
    refreshAi();
  }
  window.addEventListener('hashchange', route);
  buildTree();
  route();
  // Capabilities resolve later (or to null outside a claude.ai viewer); the page works without them.
  capability('sample').then((sm) => { RT.sample = sm || null; refreshAi(); });
  capability('downloads').then((d) => { RT.downloads = d || null; if (location.hash === '#notes') renderNotes(); });
  initSync();
})();
</script>
