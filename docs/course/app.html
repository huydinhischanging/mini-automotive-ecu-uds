<title>Mini ECU Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a diagnostic workbench. Dark instrument-cluster bar on top; left curriculum tree with LED status and a
   bit-field of lessons; centre lesson read like a datasheet (spec block, 13 ruled sections); right rail with contents.
   Telltale amber marks what is active or highlighted; green means done. Rails collapse on small screens. */
:root {
  --bg: #eef1f4; --surface: #fbfcfd; --sunken: #e3e8ed; --fg: #111a24; --fg2: #33414e; --muted: #667483; --line: #d2d9e0;
  --accent: #a85400; --accent-soft: #fbeedd; --on-accent: #ffffff; --amber: #a85400; --amber-soft: #fbeedd;
  --blue: #1f5fbf; --blue-soft: #e2ebf8; --ok: #1d7d44; --ok-soft: #dff1e6; --bad: #bf342b; --bad-soft: #fbe5e3; --violet: #6c45b5;
  --bar-bg: #121a23; --bar-fg: #e9eef3; --bar-muted: #93a1af; --bar-line: #2a3642; --led-off: #cfd7df;
  --code-bg: #f5f7f9; --code-hl: #fdf1df; --code-flash: #fbdcae;
  --t-kw: #9c2489; --t-str: #1d7d44; --t-num: #a85400; --t-com: #7c8995; --t-fn: #1f5fbf; --t-type: #0d6f6a; --t-pre: #6c45b5;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --surface: #131a21; --sunken: #1a232c; --fg: #e4eaf0; --fg2: #c0cbd5; --muted: #8796a4; --line: #26313c;
    --accent: #f0a338; --accent-soft: #33260f; --on-accent: #1a1206; --amber: #f0a338; --amber-soft: #33260f;
    --blue: #7ea7f0; --blue-soft: #18263d; --ok: #4cc27f; --ok-soft: #12301f; --bad: #ef6f65; --bad-soft: #3a1b19; --violet: #ad8cec;
    --bar-bg: #090d11; --bar-fg: #e4eaf0; --bar-muted: #8796a4; --bar-line: #222c36; --led-off: #2a3540;
    --code-bg: #10161c; --code-hl: #2a2111; --code-flash: #4a3713;
    --t-kw: #e48bd6; --t-str: #8fd6a4; --t-num: #f0b35a; --t-com: #6e7f8d; --t-fn: #8fb1f5; --t-type: #5fd3c2; --t-pre: #c3a6f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --surface: #131a21; --sunken: #1a232c; --fg: #e4eaf0; --fg2: #c0cbd5; --muted: #8796a4; --line: #26313c;
  --accent: #f0a338; --accent-soft: #33260f; --on-accent: #1a1206; --amber: #f0a338; --amber-soft: #33260f;
  --blue: #7ea7f0; --blue-soft: #18263d; --ok: #4cc27f; --ok-soft: #12301f; --bad: #ef6f65; --bad-soft: #3a1b19; --violet: #ad8cec;
  --bar-bg: #090d11; --bar-fg: #e4eaf0; --bar-muted: #8796a4; --bar-line: #222c36; --led-off: #2a3540;
  --code-bg: #10161c; --code-hl: #2a2111; --code-flash: #4a3713;
  --t-kw: #e48bd6; --t-str: #8fd6a4; --t-num: #f0b35a; --t-com: #6e7f8d; --t-fn: #8fb1f5; --t-type: #5fd3c2; --t-pre: #c3a6f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding-block: 0; min-height: 52px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar-bg); color: var(--bar-fg); border-bottom: 1px solid var(--bar-line); flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; letter-spacing: .04em; text-transform: uppercase; color: var(--bar-fg); display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.brand:hover { text-decoration: none; }
.top nav { display: flex; gap: 0; flex-wrap: wrap; align-self: stretch; }
.top nav a { display: flex; align-items: center; padding: 0 12px; color: var(--bar-muted); font-size: 13.5px; font-weight: 500; box-shadow: inset 0 -2px 0 transparent; }
.top nav a:hover { color: var(--bar-fg); text-decoration: none; }
.top nav a.on { color: var(--bar-fg); box-shadow: inset 0 -2px 0 var(--accent); text-decoration: none; }
.top .grow { flex: 1; }
.pill { font-family: var(--f-mono); font-size: 12px; color: var(--bar-muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.pill .bar { width: 110px; background: var(--bar-line); }
.top .sync { color: var(--bar-muted); border-color: var(--bar-line); }
.top .sync.on { color: var(--ok); border-color: var(--ok); }
.top .sync.warn { color: var(--accent); border-color: var(--accent); }
#menu { display: none; background: transparent; color: var(--bar-fg); border-color: var(--bar-line); }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 270px; }
.layout.no-rail { grid-template-columns: 300px minmax(0, 1fr); }
#side { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
#main { overflow-y: auto; min-height: 0; min-width: 0; }
#rail { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0; padding: 18px 16px 30px; display: flex; flex-direction: column; gap: 20px; }
.layout.no-rail #rail { display: none; }

/* progress bar */
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* curriculum tree */
.side-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.side-head input { width: 100%; }
.filters { display: flex; gap: 4px; }
.filters button { font-size: 12px; padding: 4px 8px; }
.tree { padding: 6px 8px 30px; }
.lv { margin-top: 10px; }
.lv > .lv-t { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; display: flex; justify-content: space-between; }
details.ch { border-radius: 6px; }
details.ch > summary { list-style: none; cursor: pointer; padding: 7px 8px; border-radius: 6px; font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
details.ch > summary::-webkit-details-marker { display: none; }
details.ch > summary:hover { background: var(--sunken); }
details.ch > summary .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; }
details.ch > summary .t { flex: 1; min-width: 0; }
details.ch > summary .c { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; }
.ls-t { font-size: 12px; color: var(--muted); padding: 6px 8px 2px 28px; font-weight: 500; }
a.sub { display: flex; gap: 8px; align-items: flex-start; padding: 5px 8px 5px 28px; border-radius: 5px; color: var(--fg2); font-size: 13px; line-height: 1.4; }
a.sub:hover { background: var(--sunken); text-decoration: none; }
a.sub.on { background: var(--accent-soft); color: var(--fg); font-weight: 500; }
a.sub .st { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: var(--surface); }
a.sub.done .st { background: var(--ok); border-color: var(--ok); }
a.sub .bm { margin-left: auto; color: var(--amber); font-size: 11px; }
a.sub .id { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; margin-top: 1px; }

/* lesson column */
.page { max-width: 860px; margin: 0 auto; padding-block: 26px 80px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; }
.crumb { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
h1 { font-family: var(--f-body); font-weight: 700; font-size: 1.85rem; line-height: 1.25; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
h2.sec { font-size: 1.15rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
h2.sec .k { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; }
h3 { font-size: 1rem; margin: 0; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.badge.beginner { color: var(--ok); border-color: var(--ok); }
.badge.intermediate { color: var(--blue); border-color: var(--blue); }
.badge.advanced { color: var(--violet); border-color: var(--violet); }
.badge.extra { color: var(--amber); border-color: var(--amber); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
section.s { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 16px; }
.prose { font-size: 15px; line-height: 1.7; color: var(--fg2); display: flex; flex-direction: column; gap: 10px; }
.prose p { margin: 0; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 5px; }
.prose b { color: var(--fg); }
.prose .tbl { overflow-x: auto; }
.prose table, .tblx { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.prose th, .prose td, .tblx th, .tblx td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; text-align: left; vertical-align: top; }
.prose th, .tblx th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.callout { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; color: var(--fg); font-size: 14px; line-height: 1.6; }
.goal { background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; }
pre.snip { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; }
pre.snip code { background: none; padding: 0; font-size: inherit; }
a.flink { font-family: var(--f-mono); font-size: .86em; cursor: pointer; background: var(--blue-soft); color: var(--blue); padding: 1px 5px; border-radius: 4px; }
a.xref { font-weight: 500; }

/* code blocks */
.code { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.code-h { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.code-h .p { font-family: var(--f-mono); font-size: 12.5px; color: var(--fg); font-weight: 500; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.code-h .r { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.code-h button { font-size: 12px; padding: 3px 8px; }
.code-cap { padding: 8px 12px; font-size: 13px; color: var(--fg2); border-bottom: 1px solid var(--line); background: var(--surface); line-height: 1.55; }
.lines { overflow-x: auto; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; padding: 6px 0; }
.ln { display: flex; min-width: max-content; }
.ln .no { flex: none; width: 3.6em; padding-right: 12px; text-align: right; color: var(--muted); user-select: none; opacity: .75; }
.ln .tx { white-space: pre; padding-right: 16px; }
.ln.hl { background: var(--code-hl); }
.ln.hl .no { color: var(--amber); opacity: 1; font-weight: 600; }
.ln.flash { background: var(--code-flash); transition: background .6s; }
.ln .mk { flex: none; width: 1.4em; text-align: center; font-size: 10px; color: var(--surface); }
.ln .mk b { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px; background: var(--amber); font-family: var(--f-body); font-weight: 700; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--t-kw); }
.hljs-string, .hljs-char { color: var(--t-str); }
.hljs-number { color: var(--t-num); }
.hljs-comment, .hljs-quote { color: var(--t-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--t-fn); }
.hljs-type, .hljs-title.class_ { color: var(--t-type); }
.hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string { color: var(--t-pre); }
.hljs-variable, .hljs-attr, .hljs-params { color: inherit; }
.explain { display: flex; flex-direction: column; gap: 8px; }
.ex-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); cursor: pointer; font-size: 14px; line-height: 1.6; color: var(--fg2); }
.ex-item:hover { border-color: var(--amber); }
.ex-item .tag { font-family: var(--f-mono); font-size: 11.5px; background: var(--amber-soft); color: var(--amber); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }

/* run steps */
ol.run { margin: 0; padding: 0; list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: 0; }
ol.run li { counter-increment: r; position: relative; padding: 0 0 14px 40px; font-size: 14.5px; line-height: 1.6; color: var(--fg2); }
ol.run li::before { content: counter(r); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--f-mono); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
ol.run li::after { content: ""; position: absolute; left: 12.5px; top: 28px; bottom: 2px; width: 1px; background: var(--line); }
ol.run li:last-child::after { display: none; }

/* figures */
.fig { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.fig-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fig-ctl .st { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.figcap { font-size: 13px; color: var(--muted); line-height: 1.55; }
.seq-wrap { overflow-x: auto; }
.seq text { font-family: var(--f-body); font-size: 12px; fill: var(--fg2); }
.seq .actor rect { fill: var(--sunken); stroke: var(--line); }
.seq .actor text { font-weight: 600; fill: var(--fg); font-size: 12.5px; }
.seq .life { stroke: var(--line); stroke-dasharray: 4 4; }
.seq .msg line, .seq .msg path { stroke: var(--fg2); stroke-width: 1.4; fill: none; }
.seq .msg polygon { fill: var(--fg2); }
.seq .msg text { font-family: var(--f-mono); font-size: 11.5px; }
.seq .msg.dim { opacity: .15; }
.seq .msg.cur line, .seq .msg.cur path { stroke: var(--amber); stroke-width: 2.4; }
.seq .msg.cur polygon { fill: var(--amber); }
.seq .msg.cur text { fill: var(--amber); font-weight: 600; }
.seq .msg .num { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.flow .node { border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px; font-size: 14px; line-height: 1.5; background: var(--surface); color: var(--fg2); transition: opacity .3s, border-color .3s; }
.flow .node.start, .flow .node.end { border-radius: 20px; background: var(--accent-soft); color: var(--fg); font-weight: 500; }
.flow .node.dec { border-style: dashed; border-color: var(--blue); }
.flow .node.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--fg); }
.flow .node.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--fg); }
.flow .arrow { align-self: center; color: var(--muted); font-size: 14px; line-height: 1; padding: 3px 0; }
.flow .node.dim { opacity: .3; }
.flow .node.cur { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber-soft); opacity: 1; }
.layers { display: flex; flex-direction: column; gap: 6px; }
.layers .row { display: grid; grid-template-columns: 170px 1fr; gap: 8px; align-items: stretch; }
.layers .lab { font-family: var(--f-display); font-size: 12.5px; letter-spacing: .05em; color: var(--fg); background: var(--sunken); border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; }
.layers .items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px dashed var(--line); border-radius: 6px; padding: 6px; }
.layers .items span { font-family: var(--f-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
.bytes { display: flex; flex-wrap: wrap; gap: 4px; }
.bytes .b { flex: 1 1 90px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.bytes .b .i { font-family: var(--f-mono); font-size: 11px; color: var(--muted); background: var(--sunken); padding: 3px 8px; }
.bytes .b .v { font-size: 13px; font-weight: 600; padding: 6px 8px 2px; color: var(--fg); }
.bytes .b .d { font-size: 12px; color: var(--muted); padding: 0 8px 7px; line-height: 1.45; }
.fsm { display: flex; flex-direction: column; gap: 10px; }
.fsm .states { display: flex; flex-wrap: wrap; gap: 6px; }
.fsm .states span { font-family: var(--f-mono); font-size: 12px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 3px 10px; }

/* widgets */
.wg { display: flex; flex-direction: column; gap: 10px; }
.wg .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wg input[type=text] { font-family: var(--f-mono); font-size: 13px; flex: 1 1 220px; min-width: 0; }
.wg .out { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.wg .big { font-family: var(--f-mono); font-size: 1.2rem; font-weight: 600; color: var(--accent); }
.bitgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.bitgrid label { border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; text-align: center; font-family: var(--f-mono); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.bitgrid label.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.bitgrid input { margin: 0; accent-color: var(--amber); }

/* video placeholder */
.video { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.video .screen { aspect-ratio: 16 / 7; max-width: 100%; background: linear-gradient(135deg, var(--sunken), var(--accent-soft)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; }
.video .screen .play { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 18px; }
.video .screen .vt { font-weight: 700; font-size: 1.05rem; color: var(--fg); text-wrap: balance; }
.video .screen .vd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.video .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--fg2); line-height: 1.6; }
.video ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.video .tagline { font-size: 12px; color: var(--amber); font-weight: 600; }

/* pitfalls, exercise, quiz */
.pit { display: flex; flex-direction: column; gap: 8px; }
.pit div { border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 0 8px 8px 0; padding: 10px 14px; background: var(--surface); font-size: 14px; line-height: 1.6; color: var(--fg2); }
.pit b { color: var(--fg); display: block; margin-bottom: 2px; }
.exb { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
details.reveal > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); }
details.reveal[open] > summary { margin-bottom: 8px; }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.q { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.q .qt { font-weight: 600; font-size: 14.5px; line-height: 1.55; }
.q .opt { text-align: left; font-size: 14px; padding: 9px 12px; line-height: 1.5; border-radius: 6px; }
.q .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.q .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q .why { font-size: 13.5px; line-height: 1.6; color: var(--fg2); border-top: 1px dashed var(--line); padding-top: 8px; }
.score { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
ul.sum { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; line-height: 1.6; color: var(--fg2); }
.note-box textarea { width: 100%; min-height: 110px; resize: vertical; line-height: 1.55; }
.note-box .saved { font-size: 12px; color: var(--muted); }
.navpn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.navpn a { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); color: var(--fg); display: flex; flex-direction: column; gap: 3px; font-size: 14px; font-weight: 500; }
.navpn a span { font-size: 12px; color: var(--muted); font-weight: 400; }
.navpn a.nx { text-align: right; }
.navpn a:hover { border-color: var(--accent); text-decoration: none; }

/* rail */
.rail-sec { display: flex; flex-direction: column; gap: 8px; }
.rail-sec h4 { margin: 0; font-family: var(--f-display); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.toc a { display: block; font-size: 13px; color: var(--fg2); padding: 3px 0 3px 10px; border-left: 2px solid var(--line); }
.toc a.on { border-left-color: var(--accent); color: var(--accent); font-weight: 500; }
.concept { font-size: 12.5px; line-height: 1.5; color: var(--fg2); }
.concept b { color: var(--fg); display: block; font-size: 13px; }
.rail-sec .flink { display: inline-block; margin: 2px 0; }
.pre-l a { display: block; font-size: 13px; padding: 2px 0; }
.pre-l a.done::after { content: " ✓"; color: var(--ok); }

/* code browser */
.browser { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; height: 100%; min-height: 0; }
.browser > div { overflow: auto; min-height: 0; }
.ftree { border-right: 1px solid var(--line); background: var(--surface); padding: 10px 8px 30px; }
.ftree .grp { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 10px 6px 3px; overflow-wrap: anywhere; }
.ftree a { display: block; font-family: var(--f-mono); font-size: 12px; padding: 3px 8px 3px 14px; border-radius: 4px; color: var(--fg2); }
.ftree a.on { background: var(--accent-soft); color: var(--accent); }
.fview { min-width: 0; }
.fview .code { border-radius: 0; border: 0; min-height: 100%; }
.xpanel { border-left: 1px solid var(--line); background: var(--surface); padding: 14px 14px 30px; display: flex; flex-direction: column; gap: 18px; font-size: 13px; }
.xpanel h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.xpanel .ext { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.fnx { border-top: 1px solid var(--line); padding: 7px 0; }
.fnx > a { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; cursor: pointer; }
.fnx ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* home, map, flash, notes */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero p { margin: 0; font-size: 15.5px; line-height: 1.7; color: var(--fg2); max-width: 68ch; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.4rem; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.lvcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.lvcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lvcard h3 { font-family: var(--f-display); letter-spacing: .04em; }
.lvcard ol { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg2); display: flex; flex-direction: column; gap: 3px; }
.method { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.method div { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--surface); }
.method div b { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.graph-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.graph text { font-family: var(--f-mono); font-size: 11.5px; fill: var(--fg); pointer-events: none; }
.graph .node rect { fill: var(--sunken); stroke: var(--line); cursor: pointer; }
.graph .node.common rect { fill: var(--accent-soft); stroke: var(--accent); }
.graph .node.mcal rect { fill: var(--amber-soft); stroke: var(--amber); }
.graph .node.app rect { fill: var(--blue-soft); stroke: var(--blue); }
.graph .edge { stroke: var(--muted); stroke-width: 1.1; fill: none; opacity: .45; }
.graph .colt { font-family: var(--f-display); font-size: 12px; fill: var(--muted); letter-spacing: .1em; }
.graph.focus .edge { opacity: .07; }
.graph.focus .edge.on { opacity: 1; stroke: var(--amber); stroke-width: 2; }
.graph.focus .node { opacity: .35; }
.graph.focus .node.on { opacity: 1; }
.flash { max-width: 620px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card { min-height: 230px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 12px; cursor: pointer; text-align: center; }
.card .term { font-size: 1.45rem; font-weight: 700; color: var(--fg); text-wrap: balance; }
.card .def { font-size: 15px; line-height: 1.65; color: var(--fg2); }
.card .from { font-size: 12px; color: var(--muted); }
.card.known { border-color: var(--ok); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list .it { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.list .it pre { margin: 0; white-space: pre-wrap; font-family: var(--f-body); font-size: 13.5px; color: var(--fg2); }
.empty { color: var(--muted); font-size: 14px; }
.confirm { border: 1px solid var(--bad); border-radius: 8px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bad-soft); font-size: 14px; }

/* account sync, Claude tutor, AI controls */
.sync { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.sync.on { color: var(--ok); border-color: var(--ok); }
.sync.warn { color: var(--amber); border-color: var(--amber); }
button.ai { border-color: var(--accent); color: var(--accent); }
button.ai::before { content: "✦ "; }
.fab { position: fixed; z-index: 30; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; background: var(--accent); color: var(--surface); border-color: var(--accent); box-shadow: 0 6px 22px rgba(0, 0, 0, .2); }
#tutor { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0, 0, 0, .14); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tutor-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.tutor-h b { font-size: 14.5px; }
.tutor-h .ctx { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#t-log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.msg { font-size: 14px; line-height: 1.6; min-width: 0; }
.msg.me { align-self: flex-end; max-width: 88%; background: var(--accent-soft); color: var(--fg); border-radius: 12px 12px 3px 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { color: var(--fg2); display: flex; flex-direction: column; gap: 8px; }
.msg.bot p { margin: 0; }
.msg.bot ul, .msg.bot ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.msg.bot pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; }
.msg.bot pre code { background: none; padding: 0; }
.msg.note { font-size: 13px; color: var(--muted); }
.t-quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.t-quick button { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.t-form { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.t-form textarea { width: 100%; min-height: 66px; resize: vertical; line-height: 1.5; }
.grade { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.grade textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.55; }
.verdict { font-weight: 700; }
.verdict.good { color: var(--ok); }
.verdict.mid { color: var(--amber); }
.verdict.bad { color: var(--bad); }
.more-quiz { display: flex; flex-direction: column; gap: 12px; }
.layer-strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.layer-strip span { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 8px; border-radius: 4px; border: 1px dashed var(--line); }
.layer-strip b { font-weight: 500; margin-right: 4px; }
.layer-strip span.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
figure.figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
/* system data-path diagram */
.mech-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
.mech { display: block; width: 100%; min-width: 760px; height: auto; color: var(--fg2); }
.mech .zone { fill: var(--sunken); stroke: var(--line); }
.mech .zt { font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; fill: var(--muted); }
.mech .box { cursor: pointer; }
.mech .box rect { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
.mech .box.hot rect { stroke: var(--accent); stroke-width: 2; }
.mech .box:hover rect, .mech .box:focus rect { fill: var(--accent-soft); }
.mech .box text { font-family: var(--f-body); font-size: 13px; fill: var(--fg); }
.mech .ar { stroke: currentColor; stroke-width: 1.4; fill: none; }
.mech .ar.hot { stroke: var(--accent); stroke-width: 2.2; }
.mech .lb { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.mech .lb.hot { fill: var(--accent); }
.mech .mk { fill: var(--fg2); }
.mech .mk.hot { fill: var(--accent); }
.mech .bus { stroke: var(--amber); stroke-width: 3; }
.mech .bus-t { font-family: var(--f-mono); font-size: 11.5px; fill: var(--amber); }
.brand svg { color: var(--accent); flex: none; }

/* ---------- workbench details ---------- */
/* bit-field: one cell per sub-lesson, grouped by chapter and level */
.bitfield { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-end; }
.bf-lv { display: flex; flex-wrap: wrap; gap: 4px; }
.bf-ch { display: flex; gap: 2px; }
.bf-c { display: block; width: 4px; height: 11px; border-radius: 1px; background: var(--led-off); }
.bf-c.on { background: var(--ok); }
.bf-c.cur { background: var(--accent); }
.bitfield.big { gap: 10px 14px; }
.bitfield.big .bf-lv { gap: 7px; }
.bitfield.big .bf-ch { gap: 3px; }
.bitfield.big .bf-c { width: 10px; height: 26px; border-radius: 2px; }
.bitfield.big a.bf-c:hover, .bitfield.big a.bf-c:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bf-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.bf-key i { display: inline-block; width: 8px; height: 13px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; background: var(--led-off); }
.bf-key i.on { background: var(--ok); }
.bf-key i.cur { background: var(--accent); }
.side-prog { display: flex; justify-content: space-between; font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.side-prog span:last-child { font-family: var(--f-mono); letter-spacing: 0; font-variant-numeric: tabular-nums; }
/* sidebar LEDs */
a.sub .st { width: 9px; height: 9px; margin-top: 5px; border-radius: 2px; border: 0; background: var(--led-off); font-size: 0; }
a.sub.done .st { background: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
a.sub.on .st { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
a.sub.on { background: var(--accent-soft); color: var(--fg); }
details.ch > summary .n { color: var(--accent); }
/* lesson head as a spec sheet */
.lhead { display: flex; flex-direction: column; gap: 12px; padding-bottom: 22px; border-bottom: 2px solid var(--fg); }
.lid-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lid { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 4px; padding: 1px 8px; }
.lhead h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 1.15rem + 1.5vw, 2.3rem); line-height: 1.18; margin: 0; letter-spacing: .005em; }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.spec div { background: var(--surface); padding: 8px 12px; min-width: 0; }
.spec dt { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: 2px 0 0; font-family: var(--f-mono); font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.spec dd.done { color: var(--ok); }
/* ruled section headings */
h2.sec { font-family: var(--f-display); font-size: 13.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg); gap: 12px; }
h2.sec .k { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; color: var(--accent); background: none; padding: 0; border-radius: 0; }
h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.goal { background: none; border-left: 3px solid var(--accent); border-radius: 0; padding: 2px 0 2px 16px; }
.goal p { font-size: 16.5px; line-height: 1.6; color: var(--fg); }
/* code */
.code { border-radius: 6px; }
.code-h .p .dir { color: var(--muted); font-weight: 400; }
.ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--accent); }
.ln.hl .no { color: var(--accent); }
.ln .mk b { background: var(--accent); color: var(--on-accent); }
.ex-item .tag { background: var(--accent-soft); color: var(--accent); }
.ex-item:hover { border-color: var(--accent); }
/* video storyboard */
.video { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 8px; }
.vh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vtag { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px; }
.vh b { font-size: 15px; flex: 1; min-width: 0; }
.vd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.vgoal { margin: 0; font-size: 14px; color: var(--fg2); }
.story { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.story li { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--bg); font-size: 13.5px; line-height: 1.5; color: var(--fg2); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.story li span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
/* pitfalls read like fault entries */
.pit div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; border-left: 1px solid var(--line); border-radius: 6px; }
.pit .pcode { grid-row: span 2; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 2px 7px; align-self: start; }
.pit b { margin-bottom: 0; }
ul.sum { list-style: none; padding-left: 0; }
ul.sum li { position: relative; padding-left: 20px; }
ul.sum li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.q .opt:hover:not(.right):not(.wrong) { border-color: var(--accent); }
/* home */
.hero2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero-txt { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero2 h1 { font-family: var(--f-display); font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem); line-height: 1.14; margin: 0; }
.hero2 p { margin: 0; font-size: 15.5px; line-height: 1.7; color: var(--fg2); max-width: 60ch; }
.eyebrow { font-family: var(--f-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hero-prog { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hp-h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hp-h b { font-family: var(--f-mono); font-size: 22px; letter-spacing: 0; color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.lvcard { gap: 10px; }
.lv-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lv-h b { font-family: var(--f-mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.lvcard ol { gap: 8px; }
.lvcard ol li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; }
.chbar { grid-column: 1 / -1; height: 3px; background: var(--led-off); border-radius: 2px; overflow: hidden; }
.chbar i { display: block; height: 100%; background: var(--ok); }
.graph .node.mcal rect { fill: var(--sunken); stroke: var(--fg2); }
.mech .bus { stroke: var(--muted); }
.mech .bus-t { fill: var(--muted); }
.fab { color: var(--on-accent); }
@media (max-width: 900px) { .hero2 { grid-template-columns: 1fr; } }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 280px minmax(0, 1fr); }
  #rail { display: none; }
  .inline-rail { display: block !important; }
  .browser { grid-template-columns: 220px minmax(0, 1fr); }
  .xpanel { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .browser { height: auto; }
}
.inline-rail { display: none; }
@media (max-width: 820px) {
  html, body { height: auto; }
  body { overflow: auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  #menu { display: inline-block; }
  .layout, .layout.no-rail { display: block; }
  #side { position: fixed; z-index: 25; left: 0; top: 0; bottom: 0; width: min(88vw, 340px); transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.25); padding-top: env(safe-area-inset-top, 0px); }
  #side.open { transform: none; }

<script>/*__COURSE_DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  'use strict';
  const C = window.COURSE;
  const SUB = C.subs, ORDER = C.order, FILES = Object.keys(C.src);
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const norm = (t) => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  const hid = (id) => 'l-' + id.replace(/\./g, '-');
  const main = $('#main'), rail = $('#rail'), layout = $('#layout');

  // ------------------------------------------------------------ storage (per-viewer convenience)
  const KEY = 'mini-ecu-course-v1';
  let ST = { done: [], bm: [], notes: {}, quiz: {}, last: '', known: [] };
  try { const raw = localStorage.getItem(KEY); if (raw) ST = Object.assign(ST, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { /* storage unavailable */ } };
  // Local copy always; the account copy (db) follows when this view has one.
  const save = () => { saveLocal(); pushRemote(); };
  const isDone = (id) => ST.done.includes(id);
  const isBm = (id) => ST.bm.includes(id);
  const toggleIn = (arr, id) => { const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); };
  // Runtime capabilities of the claude.ai viewer; each stays null where this view has none.
  const RT = { sample: null, downloads: null };
  let curLesson = null;

  // ------------------------------------------------------------ lookups
  const LV = {}, CH = {}, LS = {};
  C.tree.forEach((lv) => { LV[lv.id] = lv; lv.chapters.forEach((ch) => { CH[ch.id] = Object.assign(ch, { lv: lv.id }); ch.lessons.forEach((ls) => { LS[ls.id] = Object.assign(ls, { ch: ch.id }); }); }); });
  const LEVEL_NAME = { beginner: 'Beginner', intermediate: 'Intermediate', advanced: 'Advanced' };
  const SEARCH = {};
  ORDER.forEach((id) => { SEARCH[id] = norm(SUB[id].id + ' ' + SUB[id].text); });
  const FILE_LESSONS = {};
  ORDER.forEach((id) => SUB[id].code.forEach((c) => { (FILE_LESSONS[c.f] = FILE_LESSONS[c.f] || []); if (!FILE_LESSONS[c.f].includes(id)) FILE_LESSONS[c.f].push(id); }));

  // ------------------------------------------------------------ syntax highlighting (whole file, split by line)
  const HL = {};
  function splitHtml(html) {
    const out = []; let cur = ''; const stack = [];
    const re = /(<span[^>]*>)|(<\/span>)|([^<]+)|(<)/g; let m;
    while ((m = re.exec(html))) {
      if (m[1]) { stack.push(m[1]); cur += m[1]; }
      else if (m[2]) { stack.pop(); cur += m[2]; }
      else {
        const parts = (m[3] || m[4]).split('\n');
        parts.forEach((p, i) => {
          if (i > 0) { cur += '</span>'.repeat(stack.length); out.push(cur); cur = stack.join(''); }
          cur += p;
        });
      }
    }
    out.push(cur);
    return out;
  }
  function hlLines(text, lang) {
    if (window.hljs && hljs.getLanguage(lang)) {
      try { return splitHtml(hljs.highlight(text, { language: lang, ignoreIllegals: true }).value); } catch (e) { /* fall back */ }
    }
    return text.split('\n').map(esc);
  }
  function fileLines(f) { if (!HL[f]) HL[f] = hlLines(C.src[f].text, C.src[f].lang); return HL[f]; }

  // ------------------------------------------------------------ sidebar
  let filter = 'all', query = '';
  function chapterCount(ch) { let n = 0, d = 0; ch.lessons.forEach((ls) => ls.subs.forEach((id) => { n++; if (isDone(id)) d++; })); return [d, n]; }
  function buildTree() {
    $('#tree').innerHTML = C.tree.map((lv) => {
      let lvN = 0, lvD = 0;
      const chs = lv.chapters.map((ch) => {
        const [d, n] = chapterCount(ch); lvN += n; lvD += d;
        const lss = ch.lessons.map((ls) => `<div class="ls-t">${esc(ls.id)} ${esc(ls.t)}</div>` + ls.subs.map((id) => {
          const s = SUB[id];
          return `<a class="sub${isDone(id) ? ' done' : ''}" href="#${hid(id)}" data-id="${id}"><span class="st" aria-hidden="true">${isDone(id) ? '✓' : ''}</span><span class="id">${id}</span><span>${esc(s.t)}</span>${isBm(id) ? '<span class="bm" title="Bookmark">★</span>' : ''}</a>`;
        }).join('')).join('');
        return `<details class="ch" data-ch="${ch.id}"><summary><span class="n">${esc(ch.id.replace('c', 'C'))}</span><span class="t">${esc(ch.t)}</span><span class="c">${d}/${n}</span></summary>${lss}</details>`;
      }).join('');
      return `<div class="lv"><div class="lv-t"><span>${LEVEL_NAME[lv.id] || lv.t}</span><span>${lvD}/${lvN}</span></div>${chs}</div>`;
    }).join('');
    applyFilter();
    updateProgress();
  }
  function applyFilter() {
    const q = norm(query.trim());
    $$('#tree a.sub').forEach((a) => {
      const id = a.dataset.id;
      let show = true;
      if (filter === 'todo') show = !isDone(id);
      if (filter === 'bm') show = isBm(id);
      if (q) show = show && q.split(/\s+/).every((w) => SEARCH[id].includes(w));
      a.hidden = !show;
    });
    $$('#tree details.ch').forEach((d) => {
      const any = $$('a.sub', d).some((a) => !a.hidden);
      d.hidden = !any;
      $$('.ls-t', d).forEach((t) => { let n = t.nextElementSibling, vis = false; while (n && n.classList.contains('sub')) { if (!n.hidden) vis = true; n = n.nextElementSibling; } t.hidden = !vis; });
      if ((q || filter !== 'all') && any) d.open = true;
    });
  }
  function markActive(id) {
    $$('#tree a.sub').forEach((a) => a.classList.toggle('on', a.dataset.id === id));
    if (id) { const a = $(`#tree a.sub[data-id="${id}"]`); if (a) { a.closest('details').open = true; a.scrollIntoView({ block: 'nearest' }); } }
    $('#side-bits').innerHTML = bitfield(false);
  }
  // One cell per sub-lesson, grouped by chapter, then level; links on the home page.
  function bitfield(links) {
    return C.tree.map((lv) => `<div class="bf-lv">` + lv.chapters.map((ch) => `<span class="bf-ch" title="${esc(ch.t)}">` +
      ch.lessons.flatMap((l) => l.subs).map((sid) => {
        const cls = 'bf-c' + (isDone(sid) ? ' on' : '') + (sid === curLesson ? ' cur' : '');
        return links ? `<a href="#${hid(sid)}" class="${cls}" title="${sid} ${esc(SUB[sid].t)}" aria-label="${sid} ${esc(SUB[sid].t)}${isDone(sid) ? ', đã hoàn thành' : ''}"></a>` : `<i class="${cls}"></i>`;
      }).join('') + '</span>').join('') + '</div>').join('');
  }
  function updateProgress() {
    const d = ORDER.filter(isDone).length, n = ORDER.length;
    const pct = n ? Math.round((d / n) * 100) : 0;
    $('#side-count').textContent = d + '/' + n;
    $('#side-bits').innerHTML = bitfield(false);
    $('#pill').innerHTML = `<span>${d}/${n} bài · ${pct}%</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>`;
  }
  $('#search').addEventListener('input', (e) => { query = e.target.value; applyFilter(); });
  $$('.filters button').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.f;
    $$('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    applyFilter();
  }));
  $('#menu').addEventListener('click', () => $('#side').classList.toggle('open'));
  $('#tree').addEventListener('click', (e) => { if (e.target.closest('a.sub')) $('#side').classList.remove('open'); });

  // ------------------------------------------------------------ code blocks
  function codeLinesHtml(f, a, b, hl, marks) {
    const L = fileLines(f);
    let out = '';
    for (let n = a; n <= b; n++) {
      const mk = marks && marks[n] ? `<span class="mk"><b>${marks[n]}</b></span>` : (marks ? '<span class="mk"></span>' : '');
      out += `<div class="ln${hl && hl.includes(n) ? ' hl' : ''}" data-n="${n}">${mk}<span class="no">${n}</span><span class="tx">${L[n - 1] || ' '}</span></div>`;
    }
    return out;
  }
  function codeBlock(ref, idx) {
    const marks = {};
    ref.ex.forEach((e, i) => { marks[e.line] = marks[e.line] ? marks[e.line] + ',' + (i + 1) : String(i + 1); });
    const cut = ref.f.lastIndexOf('/') + 1;
    return `<div class="code" id="code-${idx}"><div class="code-h"><span class="p"><span class="dir">${esc(ref.f.slice(0, cut))}</span>${esc(ref.f.slice(cut))}</span><span class="r">dòng ${ref.a}–${ref.b}</span>` +
      `<button type="button" data-open="${esc(ref.f)}" data-line="${ref.a}">Mở cả file</button>` +
      `<button type="button" class="ai ai-only" data-ask="${idx}"${RT.sample ? '' : ' hidden'}>Giải thích đoạn này</button></div>` +
      (ref.cap ? `<div class="code-cap">${ref.cap}</div>` : '') +
      `<div class="lines">${codeLinesHtml(ref.f, ref.a, ref.b, ref.hl, ref.ex.length ? marks : null)}</div></div>`;
  }
  function openFile(f, line) { const i = FILES.indexOf(f); if (i >= 0) location.hash = '#code-' + i + '-' + (line || 0); }
  document.addEventListener('click', (e) => {
    const fl = e.target.closest('a.flink, [data-open]');
    if (fl) { e.preventDefault(); openFile(fl.dataset.file || fl.dataset.open, +fl.dataset.line || 0); }
  });
  function flashLine(container, n) {
    const ln = $(`.ln[data-n="${n}"]`, container);
    if (!ln) return;
    ln.scrollIntoView({ block: 'center', behavior: 'smooth' });
    ln.classList.add('flash');
    setTimeout(() => ln.classList.remove('flash'), 1400);
  }

  // ------------------------------------------------------------ figures
  function figEl(fig, label) {
    const wrap = document.createElement('div');
    wrap.className = 'fig';
    if (fig.type === 'seq') {
      // Space the lifelines so every arrow label fits between the actors it joins.
      const n = fig.actors.length, top = 46, rowH = 38, CH = 6.9, LEFT = 22;
      const boxW = fig.actors.map((a) => Math.max(110, Math.round(a.length * 7.6 + 22)));
      const gaps = boxW.slice(1).map((w, i) => Math.max(140, (boxW[i] + w) / 2 + 14));
      let tailRoom = boxW[n - 1] / 2;
      fig.msgs.forEach((m) => {
        const need = m[2].length * CH + 28;
        if (m[0] === m[1]) {
          const extra = 44 + need;
          if (m[0] < n - 1) gaps[m[0]] = Math.max(gaps[m[0]], extra); else tailRoom = Math.max(tailRoom, extra);
          return;
        }
        const lo = Math.min(m[0], m[1]), hi = Math.max(m[0], m[1]);
        const have = gaps.slice(lo, hi).reduce((s2, g) => s2 + g, 0);
        if (have < need) { const add = (need - have) / (hi - lo); for (let g = lo; g < hi; g++) gaps[g] += add; }
      });
      const xs = [LEFT + boxW[0] / 2];
      gaps.forEach((g) => xs.push(xs[xs.length - 1] + g));
      const x = (i) => Math.round(xs[i]);
      const width = Math.round(xs[n - 1] + tailRoom + 12), height = top + fig.msgs.length * rowH + 30;
      let svg = `<svg class="seq" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label || 'Sơ đồ tuần tự giữa ' + fig.actors.join(', '))}">`;
      fig.actors.forEach((a, i) => {
        svg += `<line class="life" x1="${x(i)}" y1="34" x2="${x(i)}" y2="${height - 6}"/>`;
        svg += `<g class="actor"><rect x="${x(i) - boxW[i] / 2}" y="4" width="${boxW[i]}" height="30" rx="6"/><text x="${x(i)}" y="23" text-anchor="middle">${esc(a)}</text></g>`;
      });
      fig.msgs.forEach((m, k) => {
        const y = top + k * rowH + 14, a = x(m[0]), b = x(m[1]);
        let g = `<g class="msg" data-k="${k}"><text class="num" x="6" y="${y + 4}">${k + 1}</text>`;
        if (m[0] === m[1]) {
          g += `<path d="M ${a} ${y - 8} h 34 v 16 h -28"/><polygon points="${a + 4},${y + 8} ${a + 11},${y + 4} ${a + 11},${y + 12}"/>`;
          g += `<text x="${a + 40}" y="${y + 3}">${esc(m[2])}</text>`;
        } else {
          const dir = b > a ? 1 : -1;
          g += `<line x1="${a}" y1="${y}" x2="${b - dir * 7}" y2="${y}"/><polygon points="${b},${y} ${b - dir * 8},${y - 4} ${b - dir * 8},${y + 4}"/>`;
          g += `<text x="${(a + b) / 2}" y="${y - 6}" text-anchor="middle">${esc(m[2])}</text>`;
        }
        svg += g + '</g>';
      });
      svg += '</svg>';
      wrap.innerHTML = stepControls() + `<div class="seq-wrap">${svg}</div>`;
      wireSteps(wrap, $$('.msg', wrap), (items, k) => items.forEach((el, i) => { el.classList.toggle('dim', k >= 0 && i > k); el.classList.toggle('cur', i === k); }), fig.msgs.map((m) => m[3] || ''));
    } else if (fig.type === 'flow') {
      wrap.innerHTML = stepControls() + '<div class="flow">' + fig.nodes.map((nd, i) => (i ? '<div class="arrow" aria-hidden="true">▼</div>' : '') + `<div class="node ${nd[1]}">${nd[0]}</div>`).join('') + '</div>';
      wireSteps(wrap, $$('.node', wrap), (items, k) => items.forEach((el, i) => { el.classList.toggle('dim', k >= 0 && i > k); el.classList.toggle('cur', i === k); }));
    } else if (fig.type === 'layers') {
      wrap.innerHTML = '<div class="layers">' + fig.rows.map((r) => `<div class="row"><div class="lab">${esc(r[0])}</div><div class="items">${r[1].map((it) => `<span>${esc(it)}</span>`).join('')}</div></div>`).join('') + '</div>';
    } else if (fig.type === 'bytes') {
      wrap.innerHTML = (fig.title ? `<h3>${esc(fig.title)}</h3>` : '') + '<div class="bytes">' + fig.cells.map((c) => `<div class="b"><div class="i">${esc(c[0])}</div><div class="v">${esc(c[1])}</div><div class="d">${esc(c[2] || '')}</div></div>`).join('') + '</div>';
    } else if (fig.type === 'fsm') {
      wrap.innerHTML = `<div class="fsm"><div class="states">${fig.states.map((s) => `<span>${esc(s)}</span>`).join('')}</div><div class="tbl"><table class="tblx"><thead><tr><th>Từ</th><th>Đến</th><th>Khi nào</th></tr></thead><tbody>${fig.edges.map((e) => `<tr><td><code>${esc(e[0])}</code></td><td><code>${esc(e[1])}</code></td><td>${esc(e[2])}</td></tr>`).join('')}</tbody></table></div></div>`;
    } else if (fig.type === 'widget') {
      WIDGETS[fig.name](wrap);
    }
    return wrap;
  }
  function stepControls() {
    return '<div class="fig-ctl"><button type="button" data-a="play">▶ Chạy từng bước</button><button type="button" data-a="prev" aria-label="Bước trước">◀</button><button type="button" data-a="next" aria-label="Bước sau">▶</button><button type="button" data-a="all">Hiện tất cả</button><span class="st" aria-live="polite"></span></div>';
  }
  function wireSteps(wrap, items, paint, notes) {
    let k = -1, timer = null;
    const st = $('.st', wrap);
    const show = (n) => {
      k = Math.max(-1, Math.min(items.length - 1, n));
      paint(items, k);
      st.textContent = k < 0 ? '' : `Bước ${k + 1}/${items.length}` + (notes && notes[k] ? ' · ' + notes[k] : '');
    };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'play') { stop(); show(0); timer = setInterval(() => { if (k >= items.length - 1) stop(); else show(k + 1); }, 1300); }
      if (a === 'next') { stop(); show(k + 1); }
      if (a === 'prev') { stop(); show(k - 1); }
      if (a === 'all') { stop(); show(-1); }
    });
  }

  // ------------------------------------------------------------ interactive widgets (same algorithms as common/)
  const hex2 = (b) => b.toString(16).toUpperCase().padStart(2, '0');
  const parseHex = (s) => s.trim().split(/[\s,]+/).filter(Boolean).map((x) => parseInt(x, 16)).filter((v) => !isNaN(v) && v >= 0 && v <= 255);
  const bin8 = (v) => v.toString(2).padStart(8, '0');
  const WIDGETS = {
    crc(w) {
      w.innerHTML = `<div class="wg"><h3>Máy tính CRC-8 SAE J1850 (giống <code>Crc8_SaeJ1850</code>)</h3>
        <div class="row"><input type="text" id="crc-in" aria-label="Byte hex" value="03 E8 05 00 01 00 05"><button type="button" id="crc-go" class="primary">Tính</button></div>
        <div class="row"><button type="button" data-ex="31 32 33 34 35 36 37 38 39">Check value "123456789"</button><button type="button" data-ex="03 E8 05 00 01 00 05">Byte 0–6 của khung 0x100 (100,0 km/h, counter 5)</button></div>
        <div>CRC = <span class="big" id="crc-res"></span></div><div class="out" id="crc-out"></div></div>`;
      const run = () => {
        const d = parseHex($('#crc-in', w).value);
        let crc = 0xFF; const lines = ['init      crc = 0xFF = ' + bin8(0xFF)];
        d.forEach((b, i) => {
          crc ^= b; lines.push(`byte ${i} = 0x${hex2(b)} -> crc ^= byte: ${bin8(crc)}`);
          for (let k = 0; k < 8; k++) {
            const msb = (crc & 0x80) !== 0;
            crc = msb ? ((crc << 1) ^ 0x1D) & 0xFF : (crc << 1) & 0xFF;
            lines.push(`   bit ${k}: msb=${msb ? 1 : 0} ${msb ? '<<1 ^ 0x1D' : '<<1       '} -> ${bin8(crc)}`);
          }
        });
        const res = crc ^ 0xFF; lines.push(`xor-out   0x${hex2(crc)} ^ 0xFF = 0x${hex2(res)}`);
        $('#crc-res', w).textContent = '0x' + hex2(res);
        $('#crc-out', w).textContent = lines.join('\n');
      };
      $('#crc-go', w).addEventListener('click', run);
      $$('[data-ex]', w).forEach((b) => b.addEventListener('click', () => { $('#crc-in', w).value = b.dataset.ex; run(); }));
      run();
    },
    e2e(w) {
      w.innerHTML = `<div class="wg"><h3>Mô phỏng <code>E2e_Check</code> theo dãy counter</h3>
        <p class="figcap">Nhập counter của các khung lần lượt đến (0–15). Thêm <code>x</code> để giả lập khung hỏng CRC.</p>
        <div class="row"><input type="text" id="e2e-in" aria-label="Dãy counter" value="14 15 0 1 1 2 4 9 10 x 11"><button type="button" id="e2e-go" class="primary">Kiểm tra</button></div>
        <div class="out" id="e2e-out"></div></div>`;
      const run = () => {
        const seq = $('#e2e-in', w).value.trim().split(/\s+/);
        let synced = false, last = 0; const out = [];
        seq.forEach((t, i) => {
          if (t === 'x') { out.push(`khung ${i + 1}: CRC sai           -> E2E_ERR_CRC (không đụng lastCounter=${last})`); return; }
          const c = parseInt(t, 10) & 0x0F;
          if (!synced) { synced = true; last = c; out.push(`khung ${i + 1}: counter ${c}         -> E2E_INITIAL (đồng bộ)`); return; }
          const delta = (c - last) & 0x0F;
          let st;
          if (delta === 0) st = 'E2E_ERR_REPEATED (giữ lastCounter)';
          else { last = c; st = delta === 1 ? 'E2E_OK' : delta <= 3 ? `E2E_OK_SOME_LOST (mất ${delta - 1} khung)` : 'E2E_ERR_WRONG_SEQ (bỏ khung, đồng bộ lại)'; }
          out.push(`khung ${i + 1}: counter ${String(c).padStart(2)} delta ${String(delta).padStart(2)} -> ${st}`);
        });
        $('#e2e-out', w).textContent = out.join('\n');
      };
      $('#e2e-go', w).addEventListener('click', run); run();
    },
    isotp(w) {
      w.innerHTML = `<div class="wg"><h3>Tách một message UDS thành khung ISO-TP</h3>
        <div class="row"><input type="text" id="tp-in" aria-label="Payload hex" value="62 F1 95 43 54 52 4C 2D 30 2E 33 2E 30"></div>
        <div class="row"><label>BS <input type="number" id="tp-bs" min="0" max="15" value="0" style="width:70px"></label><label>STmin (ms) <input type="number" id="tp-st" min="0" max="127" value="0" style="width:80px"></label><button type="button" id="tp-go" class="primary">Tách khung</button></div>
        <div class="out" id="tp-out"></div></div>`;
      const run = () => {
        const d = parseHex($('#tp-in', w).value); const bs = +$('#tp-bs', w).value || 0; const stmin = +$('#tp-st', w).value || 0;
        const pad = (a) => { const f = a.slice(0, 8); while (f.length < 8) f.push(0xCC); return f.map(hex2).join(' '); };
        const out = [];
        if (!d.length) { $('#tp-out', w).textContent = 'Nhập ít nhất 1 byte.'; return; }
        if (d.length > 4095) { $('#tp-out', w).textContent = 'Tối đa 4095 byte (FF_DL 12 bit).'; return; }
        if (d.length <= 7) out.push(`SF  sender   -> ${pad([d.length, ...d])}    (PCI 0x0${d.length.toString(16)}: dài ${d.length})`);
        else {
          out.push(`FF  sender   -> ${pad([0x10 | (d.length >> 8), d.length & 0xFF, ...d.slice(0, 6)])}    (tổng ${d.length} byte, 6 byte đầu)`);
          out.push(`FC  receiver -> ${pad([0x30, bs, stmin])}    (CTS, BS ${bs}, STmin ${stmin})`);
          let sn = 1, off = 6, inBlock = 0;
          while (off < d.length) {
            out.push(`CF  sender   -> ${pad([0x20 | sn, ...d.slice(off, off + 7)])}    (SN ${sn}${stmin ? `, cách khung trước > ${stmin} ms` : ''})`);
            off += 7; sn = (sn + 1) & 0x0F; inBlock++;
            if (bs && inBlock >= bs && off < d.length) { out.push(`FC  receiver -> ${pad([0x30, bs, stmin])}    (block tiếp theo)`); inBlock = 0; }
          }
        }
        out.push(`\n${out.length} khung CAN cho ${d.length} byte dữ liệu`);
        $('#tp-out', w).textContent = out.join('\n');
      };
      $('#tp-go', w).addEventListener('click', run); run();
    },
    dtcbits(w) {
      const B = [['TF', 'testFailed: lần test gần nhất fail'], ['TFTOC', 'fail trong operation cycle này'], ['PDTC', 'pending: fail trong cycle này hoặc cycle trước'], ['CDTC', 'confirmed: fail đủ số lần liên tiếp'], ['TNCSLC', 'chưa test lần nào từ lần xóa'], ['TFSLC', 'đã fail từ lần xóa'], ['TNCTOC', 'chưa test trong cycle này'], ['WIR', 'đèn cảnh báo (project không hỗ trợ)']];
      w.innerHTML = `<div class="wg"><h3>Giải mã status byte và mã DTC</h3>
        <div class="row"><label>Status (hex) <input type="text" id="db-in" value="2F" style="width:80px" aria-label="Status hex"></label><span class="big" id="db-hex"></span></div>
        <div class="bitgrid" id="db-bits"></div><div class="out" id="db-out"></div>
        <div class="row"><label>Mã DTC 3 byte <input type="text" id="dc-in" value="C10087" style="width:110px" aria-label="Mã DTC"></label><span class="big" id="dc-out"></span></div></div>`;
      const grid = $('#db-bits', w);
      grid.innerHTML = B.map((b, i) => `<label data-i="${7 - i}"><input type="checkbox" data-bit="${7 - i}">bit ${7 - i}<b>${B[7 - i][0]}</b></label>`).join('');
      const paint = (v) => {
        $('#db-hex', w).textContent = '0x' + hex2(v);
        $$('input[data-bit]', grid).forEach((cb) => { const on = (v >> +cb.dataset.bit) & 1; cb.checked = !!on; cb.parentElement.classList.toggle('on', !!on); });
        $('#db-out', w).textContent = B.map((b, i) => `${(v >> i) & 1 ? '■' : '□'} bit ${i} ${b[0].padEnd(7)} ${b[1]}`).join('\n');
      };
      $('#db-in', w).addEventListener('input', (e) => paint(parseInt(e.target.value, 16) & 0xFF || 0));
      grid.addEventListener('change', () => { let v = 0; $$('input[data-bit]', grid).forEach((cb) => { if (cb.checked) v |= 1 << +cb.dataset.bit; }); $('#db-in', w).value = hex2(v); paint(v); });
      const code = () => {
        const v = parseInt($('#dc-in', w).value, 16);
        if (isNaN(v)) { $('#dc-out', w).textContent = '?'; return; }
        const b0 = (v >> 16) & 0xFF, b1 = (v >> 8) & 0xFF, b2 = v & 0xFF;
        $('#dc-out', w).textContent = 'PCBU'[b0 >> 6] + ((b0 >> 4) & 3) + (b0 & 0xF).toString(16).toUpperCase() + hex2(b1) + '-' + hex2(b2);
      };
      $('#dc-in', w).addEventListener('input', code);
      paint(0x2F); code();
    },
  };

  // ------------------------------------------------------------ system map (include graph computed from the code)
  function moduleOf(f) {
    if (/\/Core\/Src\/main\.c$/.test(f)) return f.replace(/\.c$/, '');
    if (!/^(common|sensor_ecu\/Core\/(App|Mcal)|control_ecu\/CM4\/Core\/(App|Mcal))\//.test(f) || !/\.(c|h)$/.test(f)) return null;
    return f.replace(/\.(c|h)$/, '');
  }
  function renderMap() {
    layout.classList.add('no-rail');
    const mods = {};
    FILES.forEach((f) => { const m = moduleOf(f); if (m) (mods[m] = mods[m] || []).push(f); });
    const edges = new Set();
    Object.entries(mods).forEach(([m, fs]) => fs.forEach((f) => (C.xf[f].inc || []).forEach((t) => { const tm = moduleOf(t); if (tm && tm !== m) edges.add(m + '>' + tm); })));
    const col = (m) => (/Core\/(App|Src)/.test(m) ? 0 : m.startsWith('common') ? 1 : 2);
    const cols = [[], [], []];
    Object.keys(mods).sort().forEach((m) => cols[col(m)].push(m));
    const W = 250, H = 30, GX = 120, GY = 10, X0 = 20, Y0 = 46;
    const pos = {};
    cols.forEach((c, ci) => c.forEach((m, ri) => { pos[m] = { x: X0 + ci * (W + GX), y: Y0 + ri * (H + GY) }; }));
    const height = Y0 + Math.max(...cols.map((c) => c.length)) * (H + GY) + 10, width = X0 * 2 + 3 * W + 2 * GX;
    const label = (m) => { const p = m.split('/'); const ecu = m.startsWith('sensor') ? 'S · ' : m.startsWith('control') ? 'C · ' : ''; return ecu + (p[p.length - 1] === 'main' ? 'main' : p[p.length - 1]); };
    const kind = (m) => (col(m) === 0 ? 'app' : col(m) === 1 ? 'common' : 'mcal');
    let svg = `<svg class="graph" id="graph" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Đồ thị include giữa các module">`;
    ['ỨNG DỤNG (App, main)', 'DÙNG CHUNG (common/)', 'MCAL (driver)'].forEach((t, i) => { svg += `<text class="colt" x="${X0 + i * (W + GX)}" y="26">${t}</text>`; });
    [...edges].forEach((e) => {
      const [a, b] = e.split('>'); const pa = pos[a], pb = pos[b]; if (!pa || !pb) return;
      let x1, x2;
      if (pb.x > pa.x) { x1 = pa.x + W; x2 = pb.x; } else if (pb.x < pa.x) { x1 = pa.x; x2 = pb.x + W; } else { x1 = pa.x + W; x2 = pb.x + W; }
      const y1 = pa.y + H / 2, y2 = pb.y + H / 2;
      const cx = pb.x === pa.x ? x1 + 50 : (x1 + x2) / 2;
      svg += `<path class="edge" data-a="${a}" data-b="${b}" d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}"/>`;
    });
    Object.keys(pos).forEach((m) => { const p = pos[m]; svg += `<g class="node ${kind(m)}" data-m="${m}" tabindex="0"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="6"/><text x="${p.x + 10}" y="${p.y + 19}">${esc(label(m))}</text></g>`; });
    svg += '</svg>';
    main.innerHTML = `<div class="page" style="max-width:1180px">
      <div class="hero"><h1>Bản đồ hệ thống</h1><p>Kiến trúc phân lớp và đồ thị phụ thuộc thật, được trích tự động từ các dòng <code>#include</code> trong code. Rê chuột (hoặc focus) vào một module để thấy nó phụ thuộc vào đâu; bấm để mở file.</p></div>
      <section class="s"><h2 class="sec">Đường đi thật của dữ liệu</h2>${mechFigure()}</section>
      <section class="s"><h2 class="sec">Kiến trúc phân lớp</h2><div data-fig="arch"></div></section>
      <section class="s"><h2 class="sec">Đồ thị include giữa các module firmware</h2><div class="graph-wrap">${svg}</div><p class="figcap">S = Sensor ECU, C = Control ECU. Mũi tên đi từ file include sang file được include. Không có mũi tên nào đi từ <code>common/</code> sang MCAL: đó chính là quy tắc phân lớp của project.</p></section>
      <section class="s"><h2 class="sec">Các lớp trong tester C++</h2><div data-fig="cpp"></div><p class="figcap">Quan hệ lấy từ <a class="flink" data-file="tester/include/uds/transport.hpp" data-line="0">transport.hpp</a>, <a class="flink" data-file="tester/include/uds/simulated_ecu.hpp" data-line="0">simulated_ecu.hpp</a>, <a class="flink" data-file="tester/include/uds/uds_client.hpp" data-line="0">uds_client.hpp</a> và <a class="flink" data-file="tester/tests/uds_client_test.cpp" data-line="0">uds_client_test.cpp</a>.</p></section>
      <section class="s"><h2 class="sec">Bảng ghép theo chỉ số (phải sửa cùng lúc)</h2><div class="callout"><code>Fault_t</code> trong <a class="flink" data-file="control_ecu/CM4/Core/App/control_app.c" data-line="0">control_app.c</a>, <code>k_dtcTable</code> trong <a class="flink" data-file="control_ecu/CM4/Core/App/diag_app.c" data-line="0">diag_app.c</a> và <code>enum class Monitor</code> trong <a class="flink" data-file="tester/include/uds/control_ecu.hpp" data-line="0">control_ecu.hpp</a> cùng một thứ tự: timeout, range, E2E, ADC, output. Trình biên dịch không kiểm tra được điều này.</div></section>
    </div>`;
    $('[data-fig="arch"]', main).replaceWith(figEl({ type: 'layers', rows: [
      ['Ứng dụng', ['sensor_app', 'tester_app', 'control_app', 'diag_app']],
      ['Dịch vụ chẩn đoán', ['uds_server', 'dtc_manager']],
      ['Truyền thông', ['isotp', 'e2e', 'crc8', 'can_matrix.h']],
      ['RTOS (Control)', ['FreeRTOS', 'CMSIS-RTOS2']],
      ['MCAL', ['can_drv', 'adc_drv', 'gpio_drv', 'uart_drv', 'time_drv', 'io_drv', 'sys_drv']],
      ['HAL / phần cứng', ['STM32G4 HAL', 'STM32MP1 HAL', 'FDCAN', 'SN65HVD230']],
    ] }));
    $('[data-fig="cpp"]', main).replaceWith(figEl({ type: 'layers', rows: [
      ['Interface', ['ITransport: send(), receive()']],
      ['Cài đặt ITransport', ['SimulatedEcu (link code C thật)', 'ScriptedTransport (test double)', 'RpmsgTransport (dự kiến)']],
      ['Dùng ITransport&', ['UdsClient', 'runRegressionScenario()', 'runResetScenario()']],
      ['Kiểu giá trị', ['Result<T> = variant<T, Error>', 'Error', 'Dtc', 'DidSpec / DidValue', 'SessionTiming']],
    ] }));
    const g = $('#graph');
    const focus = (m) => {
      g.classList.toggle('focus', !!m);
      $$('.edge', g).forEach((e) => e.classList.toggle('on', !!m && (e.dataset.a === m || e.dataset.b === m)));
      $$('.node', g).forEach((n) => n.classList.toggle('on', !!m && (n.dataset.m === m || $$(`.edge.on`, g).some((e) => e.dataset.a === n.dataset.m || e.dataset.b === n.dataset.m))));
    };
    $$('.node', g).forEach((n) => {
      n.addEventListener('mouseenter', () => focus(n.dataset.m)); n.addEventListener('focus', () => focus(n.dataset.m));
      n.addEventListener('mouseleave', () => focus(null)); n.addEventListener('blur', () => focus(null));
      const open = () => { const fs = mods[n.dataset.m]; openFile(fs.find((f) => f.endsWith('.c')) || fs[0], 0); };
      n.addEventListener('click', open); n.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
    rail.innerHTML = ''; main.scrollTop = 0;
  }

  // ------------------------------------------------------------ code browser
  function renderCode(fi, line) {
    layout.classList.add('no-rail');
    const f = FILES[fi] || FILES[0];
    const x = C.xf[f], L = C.src[f].text.split('\n');
    const groups = {};
    FILES.forEach((p, i) => { const g = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '.'; (groups[g] = groups[g] || []).push([p, i]); });
    const fnInfo = (d) => {
      const e = C.fn[f + '#' + d.name] || {};
      const site = (c) => `<li><a class="flink" data-file="${esc(c.file)}" data-line="${c.line}">${esc(c.file.split('/').pop())}:${c.line}</a>${c.fn ? ' trong <code>' + esc(c.fn) + '</code>' : ''}</li>`;
      let body;
      if (e.skipped) body = '<ul><li>Tên quá chung hoặc trùng ở nhiều nơi, không dò lời gọi tự động.</li></ul>';
      else if (!(e.callers || []).length && !(e.refs || []).length) body = '<ul><li>Không có lời gọi trực tiếp trong code dự án: được HAL/RTOS gọi (callback, ISR, task), là điểm vào, hoặc chỉ dùng trong test.</li></ul>';
      else body = ((e.callers || []).length ? `<ul><li><b>Được gọi bởi</b></li>${e.callers.slice(0, 12).map(site).join('')}</ul>` : '') + ((e.refs || []).length ? `<ul><li><b>Được tham chiếu (vd. gán vào con trỏ hàm)</b></li>${e.refs.slice(0, 8).map(site).join('')}</ul>` : '');
      return `<div class="fnx"><a data-goto="${d.line}">${esc(d.name)}()</a> <span class="ext">dòng ${d.line}</span>${body}</div>`;
    };
    main.innerHTML = `<div class="browser">
      <div class="ftree" aria-label="Danh sách file">${Object.entries(groups).map(([g, list]) => `<div class="grp">${esc(g)}/</div>` + list.map(([p, i]) => `<a href="#code-${i}-0" class="${i === fi ? 'on' : ''}">${esc(p.split('/').pop())}</a>`).join('')).join('')}</div>
      <div class="fview"><div class="code"><div class="code-h"><span class="p">${esc(f)}</span><span class="r">${L.length} dòng · ${esc(C.src[f].lang)}</span>${ST.last ? `<a href="#${hid(ST.last)}"><button type="button">← Về bài ${esc(ST.last)}</button></a>` : ''}</div><div class="lines" id="fl">${codeLinesHtml(f, 1, L.length, line ? [line] : [], null)}</div></div></div>
      <div class="xpanel">
        <div><h4>File này include</h4>${x.inc.length ? x.inc.map((t) => `<a class="flink" data-file="${esc(t)}" data-line="0">${esc(t)}</a>`).join('<br>') : '<span class="ext">không có file nào của project</span>'}${x.ext.length ? `<div class="ext" style="margin-top:6px">ngoài project: ${x.ext.map(esc).join(', ')}</div>` : ''}</div>
        <div><h4>Được include bởi</h4>${x.incBy.length ? x.incBy.map((t) => `<a class="flink" data-file="${esc(t)}" data-line="0">${esc(t)}</a>`).join('<br>') : '<span class="ext">không có</span>'}</div>
        <div><h4>Hàm định nghĩa trong file (${x.defs.length})</h4>${x.defs.length ? x.defs.map(fnInfo).join('') : '<span class="ext">không có (header, script hoặc tài liệu)</span>'}</div>
        <div><h4>Bài học dùng file này</h4>${(FILE_LESSONS[f] || []).map((id) => `<a href="#${hid(id)}" style="display:block">${id} ${esc(SUB[id].t)}</a>`).join('') || '<span class="ext">chưa có bài nào trích file này</span>'}</div>
      </div></div>`;
    $$('[data-goto]', main).forEach((a) => a.addEventListener('click', () => flashLine($('#fl'), +a.dataset.goto)));
    const on = $('.ftree a.on', main); if (on) on.scrollIntoView({ block: 'center' });
    if (line) setTimeout(() => flashLine($('#fl'), line), 50); else { $('.fview', main).scrollTop = 0; }
    rail.innerHTML = '';
  }

  // ------------------------------------------------------------ flashcards
  let deck = [], fi = 0, flipped = false, deckFilter = 'all';
  function buildDeck() {
    deck = [];
    ORDER.forEach((id) => { const s = SUB[id]; if (deckFilter !== 'all' && s.level !== deckFilter) return; s.concepts.forEach((c, k) => deck.push({ key: id + '#' + k, term: c[0], def: c[1], id })); });
  }
  function renderFlash() {
    layout.classList.add('no-rail');
    buildDeck(); fi = Math.min(fi, Math.max(0, deck.length - 1)); flipped = false;
    main.innerHTML = `<div class="page"><div class="hero"><h1>Flashcards</h1><p>Mọi khái niệm quan trọng trong khóa học. Bấm vào thẻ (hoặc phím cách) để lật, phím mũi tên để chuyển, phím K để đánh dấu đã thuộc.</p></div>
      <div class="flash"><div class="row"><select id="fl-lv" aria-label="Cấp độ"><option value="all">Tất cả cấp độ</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select><button type="button" id="fl-sh">Xáo trộn</button><span class="score" id="fl-c"></span></div>
      <div class="card" id="card" role="button" tabindex="0" aria-live="polite"></div>
      <div class="row"><button type="button" id="fl-p">← Trước</button><button type="button" id="fl-k">Đã thuộc</button><button type="button" id="fl-n" class="primary">Tiếp →</button></div></div></div>`;
    $('#fl-lv').value = deckFilter;
    const paint = () => {
      const c = deck[fi];
      if (!c) { $('#card').innerHTML = '<div class="def">Không có thẻ nào.</div>'; return; }
      const known = ST.known.includes(c.key);
      $('#card').className = 'card' + (known ? ' known' : '');
      $('#card').innerHTML = flipped ? `<div class="def">${c.def}</div><div class="from">Từ bài <a href="#${hid(c.id)}">${c.id} ${esc(SUB[c.id].t)}</a></div>` : `<div class="term">${esc(c.term)}</div><div class="from">Bấm để xem định nghĩa</div>`;
      $('#fl-c').textContent = `Thẻ ${fi + 1}/${deck.length} · đã thuộc ${deck.filter((d) => ST.known.includes(d.key)).length}`;
      $('#fl-k').textContent = known ? 'Bỏ đánh dấu' : 'Đã thuộc';
    };
    const move = (d) => { fi = (fi + d + deck.length) % deck.length; flipped = false; paint(); };
    $('#card').addEventListener('click', (e) => { if (e.target.closest('a')) return; flipped = !flipped; paint(); });
    $('#fl-p').addEventListener('click', () => move(-1));
    $('#fl-n').addEventListener('click', () => move(1));
    $('#fl-k').addEventListener('click', () => { const c = deck[fi]; if (c) { toggleIn(ST.known, c.key); save(); paint(); } });
    $('#fl-sh').addEventListener('click', () => { for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } fi = 0; flipped = false; paint(); });
    $('#fl-lv').addEventListener('change', (e) => { deckFilter = e.target.value; fi = 0; buildDeck(); flipped = false; paint(); });
    paint(); rail.innerHTML = '';
  }
  document.addEventListener('keydown', (e) => {
    if (!location.hash.startsWith('#flash') || e.target.closest('input, textarea, select')) return;
    if (e.key === ' ') { e.preventDefault(); $('#card') && $('#card').click(); }
    if (e.key === 'ArrowRight') $('#fl-n') && $('#fl-n').click();
    if (e.key === 'ArrowLeft') $('#fl-p') && $('#fl-p').click();
    if (e.key === 'k' || e.key === 'K') $('#fl-k') && $('#fl-k').click();
  });

      <section class="s"><h2 class="sec">Kết quả quiz (${quiz.length})</h2><div class="list">${quiz.map((id) => `<div class="it"><span><a href="#${hid(id)}">${id} ${esc(SUB[id].t)}</a> · đúng ${ST.quiz[id][0]}/${ST.quiz[id][1]}</span></div>`).join('') || '<p class="empty">Chưa làm quiz nào.</p>'}</div></section>
      <section class="s"><h2 class="sec">Đặt lại</h2><div id="reset-area"><button type="button" id="reset">Xóa toàn bộ tiến độ, ghi chú và bookmark</button></div></section></div>`;

      $('#reset-yes').addEventListener('click', () => { ST = { done: [], bm: [], notes: {}, quiz: {}, last: '', known: [] }; save(); buildTree(); renderNotes(); });

  function mechFigure() {

  function mdLite(t) {
    const inl = (x) => esc(x).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const blocks = (p) => p.split(/\n{2,}/).map((b) => b.trim()).filter(Boolean).map((b) => {

      if (/^#{1,4} /.test(b)) return `<p><b>${inl(b.replace(/^#{1,4} /, ''))}</b></p>`;
