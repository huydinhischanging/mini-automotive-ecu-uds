name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libgtest-dev

      - name: C unit tests (common/, with UBSan)
        run: make -C tests

      - name: C++ tester build (AddressSanitizer + UBSan)
        run: |
          cmake -S tester -B tester/build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build tester/build

      - name: C++ tester unit tests
        run: ctest --test-dir tester/build --output-on-failure

      - name: C++ tester against the simulated Control ECU
        run: tester/build/uds_tester --sim

      # Job logs need repository rights; annotations are public, so failures stay readable.
      - name: Report failed C++ tests as annotations
        if: failure()
        run: |
          tester/build/tester_tests --gtest_brief=1 2>&1 \
            | grep -E "Failure|Expected|Which is|Value of|Actual|\[  FAILED  \]|ERROR|runtime error" \
            | head -40 | sed 's/^/::error::/' || true
